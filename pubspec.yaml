name: eat_what
description: 中北大学选餐框架：双菜单库、预算组合与局部重抽。
publish_to: none
version: 1.0.1+30
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  crypto: ^3.0.6
  http: ^1.6.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/official.json
    - assets/official-v4.json
    - assets/rice/
    - assets/icon.png
    - assets/stores/shiweifang.webp
    - assets/stores/community.webp
    - assets/stores/jinmianlang.png
    - assets/stores/baite.jpg
    - assets/stores/baite-chinese.jpg
    - assets/stores/zhongxiaobei.jpg
