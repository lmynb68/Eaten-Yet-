name: Sync stable APKs to website
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable tag, for example v1.0.0+27'
        required: true
permissions:
  contents: read
concurrency:
  group: website-apk-release
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: website-server
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Test atomic activation
        run: python3 scripts/test-site-release.py
      - name: Download and verify published APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          mkdir payload
          gh api "repos/$GH_REPO/releases/tags/$TAG" > release-api.json
          jq -e '.draft == false and .prerelease == false' release-api.json
          gh release download "$TAG" --pattern 'EatenYet-*-android-*.apk' --dir payload
          export BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 scripts/prepare-site-release.py payload release-api.json
      - name: Upload and activate after server verification
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SERVER: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_NAME: ${{ secrets.DEPLOY_USER }}
          SITE_ROOT: ${{ vars.SITE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER_NAME" =~ ^[a-z_][a-z0-9_-]*$ && "$DEPLOY_USER_NAME" != root ]]
          [[ "$SITE_ROOT" =~ ^/var/www/[a-zA-Z0-9_-]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEYS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -f ~/.ssh/deploy ~/.ssh/deploy-askpass' EXIT
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_KEY_PASSPHRASE"\n' > ~/.ssh/deploy-askpass
          chmod 700 ~/.ssh/deploy-askpass
          export SSH_ASKPASS="$HOME/.ssh/deploy-askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          ssh-add ~/.ssh/deploy </dev/null
          opts=(-i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          remote="uploads/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${opts[@]}" "$DEPLOY_USER_NAME@$SERVER" "mkdir -p '$remote'"
          scp "${opts[@]}" payload/*.apk payload/release.json scripts/activate-site-release.py "$DEPLOY_USER_NAME@$SERVER:$remote/"
          ssh "${opts[@]}" "$DEPLOY_USER_NAME@$SERVER" "python3 '$remote/activate-site-release.py' '$remote' '$SITE_ROOT'"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/deploy

