name: Application CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Match the hosted source recorded in pubspec.lock; keep strict locking.
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub lib test
      - run: flutter test --no-pub
      - name: Android compilation check (not a release artifact)
        run: flutter build apk --debug --no-pub
      - name: Release must reject missing production signing configuration
        shell: bash
        run: |
          if flutter build apk --release --no-pub > release-check.log 2>&1; then
            echo 'Release unexpectedly succeeded without signing configuration'
            exit 1
          fi
          grep -F 'Release signing is required.' release-check.log
  supporting-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/test-site-release.py
      - run: python scripts/test_archive_source.py
      - run: python scripts/check_site.py
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
