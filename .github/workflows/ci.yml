name: Application CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib test
      - run: flutter test --no-pub
      - name: Android compilation check (not a release artifact)
        run: flutter build apk --debug --no-pub
      - name: Release must reject missing production signing configuration
        shell: bash
        run: |
          if flutter build apk --release --no-pub > release-check.log 2>&1; then
            echo 'Release unexpectedly succeeded without signing configuration'
            exit 1
          fi
          grep -F 'Release signing is required.' release-check.log
